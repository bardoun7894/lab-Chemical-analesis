name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres, not SQLite. The suite used to run on sqlite:///:memory:, which
    # ignores foreign keys entirely and is case-insensitive in LIKE — so it
    # accepted rows production rejects, and a green run said nothing about the
    # deployed system. The version here tracks the `postgres:` image in
    # docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lab_test
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://lab:lab@localhost:5432/lab_test
      DATABASE_URL: postgresql+psycopg2://lab:lab@localhost:5432/lab_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile base image
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # This is the check that would have caught the outage on 2026-08-30: a
      # commit shipped os.environ without `import os`, every gunicorn worker
      # died with NameError, and nothing noticed until production was already
      # down. Importing the app once takes a second and catches that whole
      # class of failure.
      - name: App imports and builds
        # Without this, create_app() seeds the schema into the CI database and
        # the next step — which migrates from empty — dies on
        # `relation "customers" already exists`.
        env:
          LAB_SKIP_DB_BOOTSTRAP: "1"
        run: |
          python -c "
          from app import create_app
          app = create_app('production')
          print('create_app OK,', len(list(app.url_map.iter_rules())), 'routes')
          "

      - name: Migrations apply from empty
        env:
          LAB_SKIP_DB_BOOTSTRAP: "1"
        run: |
          flask db upgrade
          flask db current

      # Autogenerate must find nothing. If the models and the migrations have
      # drifted apart, that is a bug regardless of whether the tests pass —
      # the schema you deploy would not be the schema you tested.
      - name: No schema drift between models and migrations
        env:
          LAB_SKIP_DB_BOOTSTRAP: "1"
        run: |
          flask db check

      - name: Tests
        run: pytest tests -q
