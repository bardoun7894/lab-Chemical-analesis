# Production stack: Postgres + the Flask app behind gunicorn.
#
# No secrets live in this file. Compose substitutes ${...} from the .env
# sitting beside it, which is never committed and never shipped by the deploy.
# That is deliberate: the credentials used to be written in here, so this file
# could not be committed, so git and the server disagreed — and a deploy that
# extracted git's copy over the server's silently replaced the whole Postgres
# stack with the old SQLite one. scripts/deploy.sh now verifies this file is
# byte-identical after every extract, but keeping it committable is the real
# fix.
#
# Required in .env:  POSTGRES_DB  POSTGRES_USER  POSTGRES_PASSWORD  DATABASE_URL

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab-chemical-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only — the database is never reachable from outside the host.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lab-network

  lab-chemical:
    build: .
    container_name: lab-chemical-prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9999:8000"
    volumes:
      # All three are bind mounts of live per-install state, which is why the
      # deploy excludes them from the archive it extracts.
      - ./lab_chemical.db:/app/lab_chemical.db
      - ./.env:/app/.env
      - ./app/data:/app/app/data
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      # Do NOT hardcode API keys here. ai_service reads os.environ first and
      # only falls back to app/data/app_settings.json, so a stale key set here
      # silently overrides whatever the operator configured in Admin Settings.
      # Configure keys through /admin/settings, or via the mounted .env file.
    networks:
      - lab-network

volumes:
  pgdata:

networks:
  lab-network:
    driver: bridge
